<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biblioteca Popular Sur · Préstamos</title>
  <meta name="description" content="Catálogo y préstamos online de la Biblioteca Popular Sur.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- PANTALLA 1: LOGIN -->
  <section id="pantalla-login" class="login" hidden>
    <div class="login-card">
      <div class="marca">
        <span class="marca-icono" aria-hidden="true">📚</span>
        <div>
          <h1>Biblioteca Popular Sur</h1>
          <p class="sub">Préstamos online para socios</p>
        </div>
      </div>

      <form id="form-login" novalidate>
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" placeholder="tu@email.com" required>

        <label for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••" required>

        <p id="error-login" class="error" role="alert"></p>
        <button type="submit" class="btn btn-primario btn-ancho">Ingresar</button>
      </form>

      <div class="demo">
        <strong>Usuario de prueba</strong>
        <p>sofia@bibliotecasur.org · sur2026</p>
        <button type="button" id="btn-demo" class="btn-link">Completar automáticamente</button>
      </div>
    </div>
  </section>

  <!-- PANTALLA 2: APP -->
  <div id="pantalla-app" hidden>
    <header class="topbar">
      <div class="marca marca-chica">
        <span class="marca-icono" aria-hidden="true">📚</span>
        <span class="marca-nombre">Biblioteca Sur</span>
      </div>
      <div class="usuario">
        <span>Hola, <strong id="nombre-usuario"></strong></span>
        <button id="btn-salir" class="btn btn-secundario">Salir</button>
      </div>
    </header>

    <main class="contenido">
      <!-- Catálogo -->
      <section class="catalogo" aria-labelledby="titulo-catalogo">
        <h2 id="titulo-catalogo">Catálogo</h2>

        <div class="filtros">
          <input id="buscador" type="search" placeholder="Buscar por título o autor…" aria-label="Buscar por título o autor">
          <select id="filtro-genero" aria-label="Filtrar por género">
            <option value="todos">Todos los géneros</option>
          </select>
          <label class="check">
            <input type="checkbox" id="solo-disponibles"> Solo disponibles
          </label>
        </div>

        <p id="contador-resultados" class="contador"></p>
        <ul id="lista-libros" class="lista-libros"></ul>
      </section>

      <!-- Mis préstamos -->
      <aside class="prestamos" aria-labelledby="titulo-prestamos">
        <h2 id="titulo-prestamos">Mis préstamos <span id="cupo" class="cupo"></span></h2>
        <ul id="lista-prestamos" class="lista-prestamos"></ul>
        <p class="regla">Hasta 3 libros a la vez · 14 días · 1 renovación de 7 días.</p>
      </aside>
    </main>
  </div>

  <!-- Aviso flotante -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
